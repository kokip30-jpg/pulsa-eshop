<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Objednávka zaplacena — PULSA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
<style>
  .result-wrap{ min-height:70vh; display:flex; align-items:center; justify-content:center; padding:40px 24px; }
  .result-card{ max-width:480px; width:100%; background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:44px 34px; text-align:center; }
  .result-check{ width:64px; height:64px; border-radius:50%; background:rgba(45,225,194,0.16); color:var(--cyan); display:flex; align-items:center; justify-content:center; margin:0 auto 22px; }
  .result-card h1{ font-size:22px; margin-bottom:10px; }
  .result-card p{ font-size:14.5px; color:var(--text-muted); margin-bottom:28px; }
  .order-ref{ font-family:'JetBrains Mono'; font-size:12px; color:var(--text-muted); background:var(--surface-2); border-radius:8px; padding:8px 12px; display:inline-block; margin-bottom:24px; word-break:break-all; }
</style>
</head>
<body>

<header>
  <nav class="nav">
    <a href="index.html" class="logo"><span class="logo-mark"></span>PULSA</a>
    <div class="nav-links">
      <a href="index.html">Domů</a>
      <a href="produkty.html">Přístroje</a>
      <a href="o-pristrojich.html">O přístrojích</a>
      <a href="kontakt.html">Kontakt</a>
    </div>
  </nav>
</header>

<div class="result-wrap">
  <div class="result-card">
    <div class="result-check">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M4 12l5 5 11-11"/></svg>
    </div>
    <h1>Platba proběhla úspěšně</h1>
    <p>Děkujeme za objednávku. Potvrzení jsme odeslali na váš e-mail a brzy se ozveme s dalšími kroky k dodání.</p>
    <div class="order-ref" id="sessionRef">Číslo transakce se načítá…</div>
    <div>
      <a href="index.html" class="btn btn-primary">Zpět na hlavní stránku</a>
    </div>
  </div>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const sessionId = params.get('session_id');
  document.getElementById('sessionRef').textContent = sessionId
    ? 'ID transakce: ' + sessionId
    : 'ID transakce nebylo nalezeno.';
</script>
</body>
</html>
